name: Release Sprite Scout

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Container App
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          deploymentName: sprite-scout-${{ github.run_number }}-${{ github.run_attempt }}
          template: ./infra/main.bicep
          parameters: >-
            location=${{ vars.AZURE_LOCATION || 'eastus2' }}
            resourceGroupName=${{ vars.AZURE_RESOURCE_GROUP || 'rg-sprite-scout-prod' }}
            containerImage=${{ steps.image.outputs.name }}:${{ github.sha }}
            databaseConnectionString="${{ secrets.DATABASE_CONNECTION_STRING }}"
            googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}"
            googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            budgetContactEmail="${{ vars.BUDGET_CONTACT_EMAIL }}"
          failOnStdErr: false
