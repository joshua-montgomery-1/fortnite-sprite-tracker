name: Release Sprite Scout

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare deployment parameters
        shell: python
        env:
          PARAMETER_FILE: ${{ runner.temp }}/sprite-scout-parameters.json
          LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-sprite-scout-prod' }}
          CONTAINER_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          DATABASE_CONNECTION: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SIGNING_PFX: ${{ secrets.AUTH_SIGNING_PFX }}
          AUTH_ENCRYPTION_PFX: ${{ secrets.AUTH_ENCRYPTION_PFX }}
          AUTH_SIGNING_PASSWORD: ${{ secrets.AUTH_SIGNING_PASSWORD }}
          AUTH_ENCRYPTION_PASSWORD: ${{ secrets.AUTH_ENCRYPTION_PASSWORD }}
          AUTH_CLIENTS: ${{ vars.AUTH_CLIENTS || '[]' }}
          BUDGET_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL }}
        run: |
          import json
          import os
          from pathlib import Path

          required = ["DATABASE_CONNECTION", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
                      "AUTH_SIGNING_PFX", "AUTH_ENCRYPTION_PFX",
                      "AUTH_SIGNING_PASSWORD", "AUTH_ENCRYPTION_PASSWORD"]
          missing = [name for name in required if not os.environ[name]]
          if missing:
              raise SystemExit("Missing production configuration: " + ", ".join(missing))
          clients = json.loads(os.environ["AUTH_CLIENTS"])
          if not isinstance(clients, list):
              raise SystemExit("AUTH_CLIENTS must be a JSON array")
          values = {
              "location": os.environ["LOCATION"],
              "resourceGroupName": os.environ["RESOURCE_GROUP"],
              "containerImage": os.environ["CONTAINER_IMAGE"],
              "databaseConnectionString": os.environ["DATABASE_CONNECTION"],
              "googleClientId": os.environ["GOOGLE_CLIENT_ID"],
              "googleClientSecret": os.environ["GOOGLE_CLIENT_SECRET"],
              "authSigningPfx": os.environ["AUTH_SIGNING_PFX"],
              "authEncryptionPfx": os.environ["AUTH_ENCRYPTION_PFX"],
              "authSigningPassword": os.environ["AUTH_SIGNING_PASSWORD"],
              "authEncryptionPassword": os.environ["AUTH_ENCRYPTION_PASSWORD"],
              "authClients": clients,
              "budgetContactEmail": os.environ["BUDGET_EMAIL"],
          }
          Path(os.environ["PARAMETER_FILE"]).write_text(json.dumps({
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {name: {"value": value} for name, value in values.items()},
          }))

      - name: Deploy Azure Container App
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          deploymentName: sprite-scout-${{ github.run_number }}-${{ github.run_attempt }}
          template: ./infra/main.bicep
          parameters: ${{ runner.temp }}/sprite-scout-parameters.json
          failOnStdErr: false

      - name: Remove deployment parameters
        if: always()
        shell: bash
        env:
          PARAMETER_FILE: ${{ runner.temp }}/sprite-scout-parameters.json
        run: rm -f -- "$PARAMETER_FILE"
