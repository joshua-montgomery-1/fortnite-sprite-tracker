name: Build Sprite Scout

on:
  pull_request:
    paths-ignore:
      - ".github/dependabot.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FortniteSpriteTracker.sln
      - run: dotnet build FortniteSpriteTracker.sln -c Release --no-restore
      - run: dotnet publish src/FortniteSpriteTracker/FortniteSpriteTracker.csproj -c Release --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: sprite-scout-server
          path: src/FortniteSpriteTracker/bin/Release/net10.0/publish
