<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite Scout - Fortnite Sprite Tracker</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="stylesheet" href="css/app.css?v=2" />
    <link rel="stylesheet" href="FortniteSpriteTracker.styles.css?v=2" />
</head>

<body>
    <div id="app">
        <div class="app-loading"><div class="loading-card">
            <div class="loading-brand"><span class="brandmark">S</span><span>SPRITE<em>SCOUT</em></span></div>
            <div class="loading-kicker">PREPARING YOUR FIELD GUIDE</div>
            <h1>LOADING<br><span>SPRITES.</span></h1>
            <p>Unpacking the current-season collection and your saved progress.</p>
            <div class="loading-track"><span></span></div>
            <div class="loading-meta"><strong style="margin-left:auto"></strong></div>
        </div></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
